<!DOCTYPE html>
<html>
<head>
    <title>Day 5 - Timetable</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #f2f6ff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #0f2027;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2c5364;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #e6edf5;
        }

        tr:hover {
            background-color: #d4e4f2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Java</td>
            <td>HTML</td>
            <td>DBMS</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>CSS</td>
            <td>Java</td>
            <td>Lab</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DBMS</td>
            <td>HTML</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Lab</td>
            <td>CSS</td>
            <td>Java</td>
        </tr>
    </table>

</div>

</body>
</html>
