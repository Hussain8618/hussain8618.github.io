<!DOCTYPE html>
<html>
<head>
<title>Day 9 - Form</title>
<style>
body{font-family:Arial;background:#f1f5f9;}
form{
    max-width:420px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:14px;
}
input,textarea,button{
    width:100%;
    padding:12px;
    margin-top:12px;
}
button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
}
</style>
<script>
function submitted(){
    alert("Form successfully submitted!");
}
</script>
</head>
<body>

<form onsubmit="submitted(); return false;">
<h2>Contact Form</h2>
<input type="text" placeholder="Name" required>
<input type="email" placeholder="Email" required>
<textarea placeholder="Message"></textarea>
<button type="submit">Submit</button>
</form>

</body>
</html>
